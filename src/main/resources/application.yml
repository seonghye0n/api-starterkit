spring:
  application:
    name: api-starterkit
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      client:
        registration:
          # client-id/secret이 빈 문자열이면 OAuth2ClientAutoConfiguration이 기동 자체를 막으므로
          # 값을 아예 설정하지 않았을 때를 대비해 non-blank 더미 값을 기본값으로 둔다.
          # 실제 소셜 로그인을 쓰려면 .env에 GOOGLE_CLIENT_ID/SECRET을 채워야 한다.
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: email, profile

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-env-file-must-be-at-least-32-bytes-long}
  access-token-validity: 1800000       # 30분 (ms)
  refresh-token-validity: 1209600000   # 14일 (ms)

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
