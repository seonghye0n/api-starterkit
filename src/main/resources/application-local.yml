spring:
  datasource:
    url: jdbc:mysql://localhost:3306/apistarterkit?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

logging:
  level:
    com.example.apistarterkit: DEBUG
