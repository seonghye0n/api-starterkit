spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:apistarterkit}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  docker:
    compose:
      enabled: false

logging:
  level:
    com.example.apistarterkit: INFO

# 운영 환경에서는 ddl-auto=update 대신 Flyway/Liquibase 같은 마이그레이션 도구로
# 스키마를 직접 관리하는 것을 권장한다. 이 스타터킷의 범위 밖이라 도입하지 않았다.
