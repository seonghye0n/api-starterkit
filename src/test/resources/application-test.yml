spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379
  docker:
    compose:
      enabled: false

jwt:
  secret: test-secret-key-for-junit-tests-must-be-at-least-32-bytes-long
  access-token-validity: 1800000
  refresh-token-validity: 1209600000

app:
  cors:
    allowed-origins: http://localhost:3000
  oauth2:
    redirect-uri: http://localhost:3000/oauth2/redirect
  file:
    upload-dir: build/test-uploads
